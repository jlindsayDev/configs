configs:
  ts-serve:
    content: |
      {
        "version": "0.0.1",
        "TCP": { "443": { "HTTPS": true } },
        "Web": {
          "${SERVICE}:443": {
            "Handlers": {
              "/": { "Proxy": "http://127.0.0.1:80/" }
            }
          }
        },
        "AllowFunnel": { "${TS_CERT_DOMAIN}:443": false }
      }

services:
  ts-pihole:
    image: tailscale/tailscale:latest
    container_name: ts-${SERVICE}
    hostname: ${SERVICE}
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_EXTRA_ARGS=--advertise-tags=tag:containers
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234
      - TS_ACCEPT_DNS=true
      - TS_AUTH_ONCE=true
    configs:
      - source: ts-serve
        target: /ts/config/serve.json
    volumes:
      - ./ts/config:/config
      - ./ts/state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: on-failure:3

  pihole:
    image: ${IMAGE_URL}
    network_mode: service:ts-pihole
    container_name: ${SERVICE}
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=${TZ}
    volumes:
      - ./pihole.toml:/etc/pihole/pihole.toml
      - ./etc-dnsmasq.d:/etc/dnsmasq.d
    cap_add:
      - sys_nice
    depends_on:
      ts-pihole:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pgrep", "-f", "pihole-FTL"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: on-failure:3
