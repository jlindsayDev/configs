services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    hostname: radarr
    restart: unless-stopped

    ports:
      - 7878:7878

    volumes:
      - ./config:/config
      - /data/media/movies:/movies #optional
      - /data/downloads:/downloads #optional
