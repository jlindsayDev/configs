services:
  ntfy:
    image: binwiederhier/ntfy
    container_name: ntfy
    hostname: ntfy
    restart: on-failure
    command:
      - serve
    environment:
      - TZ=PST
    user: 1000:1000
    labels:
      docktail.service.enable: true
      docktail.service.name: ntfy
      docktail.service.description: Notification Service
      docktail.service.port: 80
      docktail.service.service-port: 443
    volumes:
      - ./cache:/var/cache/ntfy
      - ./data:/etc/ntfy
    init: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:80/v1/health -O - | grep -Eo '\"healthy\"\\s*:\\s*true' || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 40s
