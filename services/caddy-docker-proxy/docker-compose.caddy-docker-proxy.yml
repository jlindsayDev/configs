# https://github.com/lucaslorentz/caddy-docker-proxy

services:
  caddy-docker-proxy:
    container_name: caddy-docker-proxy
    image: lucaslorentz/caddy-docker-proxy:ci-alpine
    restart: on-failure

    ports:
      - 80:80
      - 443:443/tcp
      - 443:443/udp

    environment:
      - CADDY_INGRESS_NETWORKS=caddy

    networks:
      - caddy

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data: {}
  caddy_config: {}
