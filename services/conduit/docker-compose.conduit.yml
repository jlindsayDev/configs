# https://docs.conduit.rs/deploying/docker.html#docker-compose
services:
  conduit:
    container_name: conduit
    hostname: conduit
    image: matrixconduit/matrix-conduit:latest
    restart: on-failure

    ports:
      - 8448:6167
    networks:
      - caddy

    volumes:
      - db:/var/lib/matrix-conduit/

    environment:
      CONDUIT_SERVER_NAME: pibox.lan
      CONDUIT_DATABASE_PATH: /var/lib/matrix-conduit/
      CONDUIT_DATABASE_BACKEND: rocksdb
      CONDUIT_PORT: 6167
      CONDUIT_MAX_REQUEST_SIZE: 20000000 # in bytes, ~20 MB
      CONDUIT_ALLOW_REGISTRATION: "true"
      CONDUIT_ALLOW_FEDERATION: "true"
      CONDUIT_ALLOW_CHECK_FOR_UPDATES: "true"
      CONDUIT_TRUSTED_SERVERS: '["matrix.org"]'
      #CONDUIT_MAX_CONCURRENT_REQUESTS: 100
      CONDUIT_ADDRESS: 127.0.0.1
      CONDUIT_CONFIG: "" # Ignore this

  ### Uncomment if you want to use your own Element-Web App.
  ### Note: You need to provide a config.json for Element and you also need a second
  ###       Domain or Subdomain for the communication between Element and Conduit
  ### Config-Docs: https://github.com/vector-im/element-web/blob/develop/docs/config.md
  element-web:
    container_name: element-web
    hostname: element-web
    image: vectorim/element-web:latest
    restart: on-failure

    ports:
      - 8009:80
    volumes:
      - ./element_config.json:/app/config.json
    depends_on:
      - conduit

  # mautrix-meta - https://docs.mau.fi/bridges/general/docker-setup.html?bridge=meta
  mautrix-meta:
    hostname: mautrix-meta
    container_name: mautrix-meta
    image: dock.mau.dev/mautrix/meta:latest
    restart: on-failure

    depends_on:
      - conduit

    volumes:
      - ./mautrix-meta:/data

  mautrix-gvoice:
    hostname: mautrix-gvoice
    container_name: mautrix-gvoice
    image: dock.mau.dev/mautrix/gvoice:latest
    restart: on-failure

    depends_on:
      - conduit

    volumes:
      - ./mautrix-gvoice:/data

volumes:
  db:
