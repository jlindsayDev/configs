services:
  caddy:
    container_name: caddy
    image: caddy:latest
    restart: on-failure

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    volumes:
      - ./config:/etc/caddy
      - ./site:/srv
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
