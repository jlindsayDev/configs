# https://github.com/binwiederhier/ntfy/blob/main/docker-compose.yml

services:
  ntfy:
    image: binwiederhier/ntfy
    container_name: ntfy
    hostname: ntfy
    restart: on-failure

    command:
      - serve

    environment:
      - TZ=PST

    # rootless
    user: 1000:1000 # optional: Set custom user/group or uid/gid

    labels:
      caddy: ntfy.airmac.local
      caddy.reverse_proxy: "{{upstreams 80}}"
      caddy.tls: internal

    networks:
      - caddy

    volumes:
      - ntfy_data:/var/cache/ntfy
      - ntfy_data:/etc/ntfy

    ports:
      - 8086:80

volumes:
  ntfy_data:
